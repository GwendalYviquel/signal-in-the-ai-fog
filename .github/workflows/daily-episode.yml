name: Daily episode

on:
  # Attempts every 15 minutes on weekday mornings, off the top of the hour, both seasons (UTC):
  # summer 4:07-7:52 Paris, winter 3:07-6:52. The first attempt at generation.publish_at (4:05 Paris)
  # or later publishes; the others stop at once (episode already out). Learning (2026-10-21/22):
  # GitHub dropped or delayed single scheduled runs by hours. Every weekday, holidays included.
  # GitHub only fires a schedule for a commit linked to a GitHub account: the last commit
  # changing this file must use a GitHub noreply email (see test_schedules_are_owned_by_a_github_account).
  schedule:
    - cron: "7,22,37,52 2-5 * * 1-5"
  workflow_dispatch:
    inputs:
      show:
        description: "Show to run (shows/<slug>); scheduled attempts run every show"
        type: string
        default: "signal-in-the-ai-fog"
      dry_run:
        description: "Script only (no ElevenLabs credits, nothing published)"
        type: boolean
        default: true
      force:
        description: "Regenerate even if today's episode already exists"
        type: boolean
        default: false
      as_scheduled:
        description: "News cutoff at today's scheduled time (4:05 Paris), as if run by the schedule"
        type: boolean
        default: false
      scheduled:
        description: "An attempt from the external scheduler (Cloudflare): same rules as a scheduled one"
        type: boolean
        default: false
      episode_date:
        description: "Catch up a past weekday (YYYY-MM-DD), with only the news published before 4:05 that day"
        type: string
        default: ""

permissions:
  contents: write   # commit scripts + create audio releases
  pages: write      # publish the RSS feed
  id-token: write
  issues: read      # listener suggestions accepted by the owner
  actions: read     # count today's failed attempts before paying for another

concurrency:
  group: daily-episode
  cancel-in-progress: false

jobs:
  shows:
    # Scheduled runs only once the SCHEDULE_ENABLED repository variable is "true":
    # gh variable set SCHEDULE_ENABLED --body true   (and --body false to pause)
    if: github.event_name != 'schedule' || vars.SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: List the shows to run
        id: list
        env:
          # A scheduled attempt (GitHub cron, or the Cloudflare scheduler) runs every show, each on its
          # own cadence; a manual run, the show named.
          WHICH: ${{ (github.event_name == 'schedule' || inputs.scheduled) && 'all' || inputs.show }}
        run: python -m engine.show matrix "$WHICH" >> "$GITHUB_OUTPUT"

  episode:
    needs: shows
    strategy:
      matrix: ${{ fromJSON(needs.shows.outputs.matrix) }}
      max-parallel: 1     # one show at a time: each commits and deploys the site
      fail-fast: false    # a failing show never stops the others
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # On scheduled runs the inputs are empty: real publication.
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      FORCE: ${{ inputs.force && 'true' || 'false' }}
      AS_SCHEDULED: ${{ inputs.as_scheduled && 'true' || 'false' }}
      EPISODE_DATE: ${{ inputs.episode_date }}
      # A scheduled attempt (GitHub cron, or the Cloudflare scheduler): not before publish_at, two
      # failed attempts a day at most. Empty for a manual run.
      SCHEDULE: ${{ github.event.schedule || (inputs.scheduled && 'external') || '' }}
      SHOW: ${{ matrix.show }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}   # also checks the public repo never names them
        run: python -m pytest -q

      - name: Generate the episode
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}   # optional, for keys not scoped to a workspace
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}   # comma-separated, never spoken
          EDITORIAL_CONTEXT: ${{ secrets[matrix.context_secret] }}   # the show's private context, never committed
        run: python -m engine.main

      - name: Keep today's script
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-script-${{ matrix.show }}
          path: build/**/*.md
          if-no-files-found: ignore

      - name: Commit the episode and its costs
        if: always()   # costs are recorded even when the run fails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shows docs
          git diff --cached --quiet && exit 0
          if git diff --cached --name-only | grep -q "/data/episodes.json$"; then msg="Episode $(TZ=Europe/Paris date +%F), $SHOW"; else msg="Costs of run ${{ github.run_id }}, $SHOW"; fi
          git commit -m "$msg"
          tools/push_main.sh
      - name: Configure GitHub Pages
        if: steps.generate.outputs.published == 'true'
        uses: actions/configure-pages@v5

      - name: Upload the RSS feed
        if: steps.generate.outputs.published == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy the RSS feed
        id: deploy
        if: steps.generate.outputs.published == 'true'
        uses: actions/deploy-pages@v4

      - name: Notify the phone
        if: always() && env.DRY_RUN == 'false'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # optional: no notification without it
        run: python -m engine.notify daily "${{ job.status }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
