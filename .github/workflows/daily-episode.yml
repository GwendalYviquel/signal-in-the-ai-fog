name: Daily episode

on:
  # Disabled until the configuration is validated.
  # GitHub schedules in UTC: 5:15 UTC = 7:15 in Paris in summer, 6:15 in winter.
  # schedule:
  #   - cron: "15 5 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Script only (no ElevenLabs credits, nothing published)"
        type: boolean
        default: true
      force:
        description: "Regenerate even if today's episode already exists"
        type: boolean
        default: false

permissions:
  contents: write   # commit scripts + create audio releases
  pages: write      # publish the RSS feed
  id-token: write

concurrency:
  group: daily-episode
  cancel-in-progress: false

jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # On scheduled runs the inputs are empty: real publication.
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      FORCE: ${{ inputs.force && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}   # also checks the public repo never names them
        run: python -m pytest -q

      - name: Generate the episode
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}   # optional, for keys not scoped to a workspace
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}   # comma-separated, never spoken
          EDITORIAL_CONTEXT: ${{ secrets.EDITORIAL_CONTEXT }}   # private audience context, never committed
        run: python -m podcast.main

      - name: Keep today's script
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-script
          path: build/*.md
          if-no-files-found: ignore

      - name: Commit the episode to the repository
        if: env.DRY_RUN == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || {
            git commit -m "Episode $(TZ=Europe/Paris date +%F)"
            git push
          }

      - name: Configure GitHub Pages
        if: env.DRY_RUN == 'false'
        uses: actions/configure-pages@v5

      - name: Upload the RSS feed
        if: env.DRY_RUN == 'false'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy the RSS feed
        id: deploy
        if: env.DRY_RUN == 'false'
        uses: actions/deploy-pages@v4
