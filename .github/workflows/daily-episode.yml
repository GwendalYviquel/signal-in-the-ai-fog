name: Daily episode

on:
  # GitHub schedules in UTC. Two lines keep the run at 4:05 Paris time all year
  # (generation.publish_at); the code keeps only the one matching today's offset.
  # Every weekday, public holidays included.
  schedule:
    - cron: "5 2 * * 1-5"   # 4:05 Paris in summer time (UTC+2)
    - cron: "5 3 * * 1-5"   # 4:05 Paris in winter time (UTC+1)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Script only (no ElevenLabs credits, nothing published)"
        type: boolean
        default: true
      force:
        description: "Regenerate even if today's episode already exists"
        type: boolean
        default: false
      as_scheduled:
        description: "News cutoff at today's scheduled time (4:05 Paris), as if run by the schedule"
        type: boolean
        default: false
      episode_date:
        description: "Catch up a past weekday (YYYY-MM-DD), with only the news published before 4:05 that day"
        type: string
        default: ""

permissions:
  contents: write   # commit scripts + create audio releases
  pages: write      # publish the RSS feed
  id-token: write

concurrency:
  group: daily-episode
  cancel-in-progress: false

jobs:
  episode:
    # Scheduled runs only once the SCHEDULE_ENABLED repository variable is "true":
    # gh variable set SCHEDULE_ENABLED --body true   (and --body false to pause)
    if: github.event_name != 'schedule' || vars.SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # On scheduled runs the inputs are empty: real publication.
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      FORCE: ${{ inputs.force && 'true' || 'false' }}
      AS_SCHEDULED: ${{ inputs.as_scheduled && 'true' || 'false' }}
      EPISODE_DATE: ${{ inputs.episode_date }}
      SCHEDULE: ${{ github.event.schedule }}   # which cron line triggered the run, empty when manual
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}   # also checks the public repo never names them
        run: python -m pytest -q

      - name: Generate the episode
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}   # optional, for keys not scoped to a workspace
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}   # comma-separated, never spoken
          EDITORIAL_CONTEXT: ${{ secrets.EDITORIAL_CONTEXT }}   # private audience context, never committed
        run: python -m podcast.main

      - name: Keep today's script
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-script
          path: build/*.md
          if-no-files-found: ignore

      - name: Commit the episode and its costs
        if: always()   # costs are recorded even when the run fails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs COSTS.md
          git diff --cached --quiet && exit 0
          if git diff --cached --name-only | grep -qx "data/episodes.json"; then msg="Episode $(TZ=Europe/Paris date +%F)"; else msg="Costs of run ${{ github.run_id }}"; fi
          git commit -m "$msg"
          git pull --rebase origin main
          git push
      - name: Configure GitHub Pages
        if: env.DRY_RUN == 'false'
        uses: actions/configure-pages@v5

      - name: Upload the RSS feed
        if: env.DRY_RUN == 'false'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy the RSS feed
        id: deploy
        if: env.DRY_RUN == 'false'
        uses: actions/deploy-pages@v4
