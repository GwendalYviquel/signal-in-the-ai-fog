name: Publication rehearsal

# Exercises the publication path without ElevenLabs and without publishing:
# a silent MP3 is uploaded as a release asset, downloaded back from its public
# URL, checked in the RSS feed and catalog (built but never written or deployed),
# then the release is always deleted. Nothing is committed.
on:
  workflow_dispatch:
    inputs:
      with_voice:
        description: "Also check both ElevenLabs voices on two short sentences (about 170 characters)"
        type: boolean
        default: false

permissions:
  contents: write   # create and delete the test release

concurrency:
  group: daily-episode   # never alongside a real run
  cancel-in-progress: false

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}   # also checks the public repo never names them
        run: python -m pytest -q

      - name: Rehearse the publication
        env:
          GH_TOKEN: ${{ github.token }}
          WITH_VOICE: ${{ inputs.with_voice && 'true' || 'false' }}
          ELEVENLABS_API_KEY: ${{ inputs.with_voice && secrets.ELEVENLABS_API_KEY || '' }}   # only for the voice check
        run: python -m podcast.rehearsal

      - name: Keep the voice sample
        if: inputs.with_voice
        uses: actions/upload-artifact@v4
        with:
          name: voice-sample
          path: build/rehearsal-*.mp3
          if-no-files-found: ignore
