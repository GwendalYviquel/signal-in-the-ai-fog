name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Install the browser for the site tests
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}   # also checks the public repo never names them
          REQUIRE_BROWSER: "1"   # site tests must run here, never be skipped
          REQUIRE_NODE: "1"      # the Cloudflare scheduler tests too
        run: python -m pytest -q
