name: Add a correction

# An error found after publication: the correction goes on the episode page, in its description in
# podcast apps and on the corrections page, and the next episode reads it as written
# (engine/corrections.py). Free: no Claude, no ElevenLabs.
on:
  workflow_dispatch:
    inputs:
      show:
        description: "Show (shows/<slug>)"
        type: string
        default: "signal-in-the-ai-fog"
      episode_date:
        description: "Date of the episode to correct (YYYY-MM-DD)"
        type: string
        required: true
      text:
        description: "The correction, read aloud as written: 'The episode of October twentieth said X. In fact, Y.' No we/our."
        type: string
        required: true

permissions:
  contents: write   # commit the correction
  pages: write      # redeploy the site and feed
  id-token: write

concurrency:
  group: daily-episode   # never at the same time as an episode run, which writes the same data
  cancel-in-progress: false

jobs:
  correction:
    runs-on: ubuntu-latest
    env:
      SHOW: ${{ inputs.show || 'signal-in-the-ai-fog' }}   # the show (shows/<slug>)
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Add the correction
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}   # a correction is spoken: same checks
          EPISODE_DATE: ${{ inputs.episode_date }}
          TEXT: ${{ inputs.text }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m engine.corrections add "$EPISODE_DATE" "$TEXT"

      - name: Commit the correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shows docs
          git commit -m "Correction to the episode of $EPISODE_DATE"
          tools/push_main.sh
        env:
          EPISODE_DATE: ${{ inputs.episode_date }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy the site and feed
        id: deploy
        uses: actions/deploy-pages@v4
