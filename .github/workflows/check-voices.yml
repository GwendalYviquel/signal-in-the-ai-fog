name: Check voices

# Checks that ElevenLabs accepts every configured voice, for a few characters:
# one word per voice, each voice tested independently. Nothing is published.
on:
  workflow_dispatch:
    inputs:
      voice_ids:
        description: "Candidate voice IDs to try, comma-separated (empty: the voices in config.yaml)"
        type: string
        default: ""
  push:
    branches: [main]
    paths: ["config.yaml"]   # whenever a voice ID may have changed

permissions:
  contents: write   # commit the cost of the check

jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check every voice
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICE_IDS: ${{ inputs.voice_ids }}
        run: python -m podcast.tts

      - name: Commit the costs
        if: always()   # costs are recorded even when the run fails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/costs.json COSTS.md
          git diff --cached --quiet && exit 0
          if git diff --cached --name-only | grep -qx "-"; then msg="Costs $(TZ=Europe/Paris date +%F)"; else msg="Costs of run ${{ github.run_id }}"; fi
          git commit -m "$msg"
          git pull --rebase origin main
          git push
