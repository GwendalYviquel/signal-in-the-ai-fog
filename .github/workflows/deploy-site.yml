name: Deploy site

# Publishes docs/ (catalog page, RSS feed, cover) to GitHub Pages whenever it
# changes on main. The daily workflow also deploys after each new episode.
on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url || steps.deploy_last.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      # Learning (2026-11-19, then 22/24/25 Nov in Stats): deploy-pages looks the artifact up right after its
      # upload and the API does not always list it yet ("No artifacts named github-pages"). Three attempts,
      # 30 s then 90 s apart; tests/test_workflows.py checks every workflow that publishes the site does this.
      - name: Deploy
        id: deploy
        continue-on-error: true   # the last attempt decides the job's outcome
        uses: actions/deploy-pages@v4

      - name: Wait before the second deployment attempt
        if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - name: Deploy (second attempt)
        id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before the last deployment attempt
        if: steps.deploy_retry.outcome == 'failure'
        run: sleep 90

      - name: Deploy (last attempt)
        id: deploy_last
        if: steps.deploy_retry.outcome == 'failure'
        uses: actions/deploy-pages@v4
