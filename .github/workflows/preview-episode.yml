name: Preview episode

# Full run without audio: Claude writes today's script, which is published as a
# "Preview" card on the catalog site. No ElevenLabs call, no release, and the
# RSS feed is not touched, so nothing reaches Spotify.
on:
  workflow_dispatch:
    inputs:
      show:
        description: "Show (shows/<slug>)"
        type: string
        default: "signal-in-the-ai-fog"
      force:
        description: "Regenerate even if today's preview already exists (or on a weekend)"
        type: boolean
        default: false

permissions:
  contents: write   # commit the preview script and catalog
  pages: write      # publish the catalog site
  id-token: write
  issues: read      # listener suggestions accepted by the owner

concurrency:
  group: daily-episode   # shared with the daily workflow: never two runs editing data/ at once
  cancel-in-progress: false

jobs:
  shows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Name the show's private context secret
        id: list
        env:
          WHICH: ${{ inputs.show }}
        run: python -m engine.show matrix "$WHICH" >> "$GITHUB_OUTPUT"

  preview:
    needs: shows
    strategy:
      matrix: ${{ fromJSON(needs.shows.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      PREVIEW: "true"
      SHOW: ${{ matrix.show }}
      FORCE: ${{ inputs.force && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}   # also checks the public repo never names them
        run: python -m pytest -q

      - name: Generate the script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}   # optional, for keys not scoped to a workspace
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}   # comma-separated, never spoken
          EDITORIAL_CONTEXT: ${{ secrets[matrix.context_secret] }}   # the show's private context, never committed
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}   # read the accepted listener suggestions
        run: python -m engine.main

      - name: Keep today's script
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-script
          path: build/**/*.md
          if-no-files-found: ignore

      - name: Commit the preview and its costs
        if: always()   # costs are recorded even when the run fails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shows docs
          git diff --cached --quiet && exit 0
          if git diff --cached --name-only | grep -q "/data/previews.json$"; then msg="Preview $(TZ=Europe/Paris date +%F)"; else msg="Costs of run ${{ github.run_id }}"; fi
          git commit -m "$msg"
          tools/push_main.sh
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy the catalog site
        id: deploy
        uses: actions/deploy-pages@v4
