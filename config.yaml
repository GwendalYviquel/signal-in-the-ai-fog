# Podcast configuration. Every TO_FILL value must be set before the first published episode.

podcast:
  title: "Signal in the AI Fog"
  description: >-
    Every weekday morning, six minutes on enterprise AI in production:
    models and vendors, European sovereignty, LLMOps and MLOps platforms,
    evaluation, regulation and retail. Script written and voice generated by AI.
  author: "Gwendal Yviquel"          # name displayed as the podcast author
  owner_name: "Gwendal Yviquel"
  owner_email: "gwendal.yviquel.devuse@gmail.com"   # public: Spotify sends the verification code here
  language: "en"
  category: "Technology"
  explicit: false
  cover_file: "cover.jpg"            # in docs/, square, 1400 to 3000 px
  spotify_url: "https://open.spotify.com/show/6yv1oUk4Qdlr4gFp7FYDPZ"   # buttons of the catalog site
  # Leave empty to use https://<owner>.github.io/<repo>/
  base_url: ""

generation:
  model: "claude-sonnet-5-5"
  max_tokens: 16000                  # room for the episode after long web searches
  web_search_max_uses: 15
  timezone: "Europe/Paris"
  # Paris time the scheduled run starts, all year: the episode is online about 15 minutes later,
  # leaving Spotify close to 3 hours to pick up the feed before a 7:00 listen. The two crons in
  # .github/workflows/daily-episode.yml (summer and winter) must match it: a test checks.
  publish_at: "04:05"
  target_words: 880                  # about 6 minutes spoken

costs:  # for COSTS.md estimates; Claude prices for generation.model, per million tokens
  priced_model: "claude-sonnet-5-5"  # change the prices below when generation.model changes
  claude_usd_per_mtok: {input: 2.0, output: 10.0, cache_write: 2.5, cache_read: 0.2}
  web_search_usd_per_1000: 10.0      # not confirmed in the API reference: check the pricing page

tts:
  voices:                            # ElevenLabs voice IDs
    host: "nPczCjzI2devNBz1zQrb"     # opening, facts, transitions, sign-off
    analyst: "XrExE9yKIg1WjnnlVkGX"  # every read layer (analysis)
  pause_seconds: 0.6                 # breath when the other voice takes over
  model_id: "eleven_multilingual_v2"
  output_format: "mp3_44100_128"
  max_chars_per_request: 4500
  use_context: true                  # previous_text / next_text for continuous delivery
  # Sent with every request, so episodes sound like tests made on the ElevenLabs platform.
  voice_settings:
    stability: 0.55                  # lower: more expressive, higher: steadier and flatter
    similarity_boost: 0.75           # closeness to the original voice
    style: 0.1                       # extra emphasis; keep low to avoid artefacts
    use_speaker_boost: true
    speed: 1.0                       # 0.7 to 1.2; slightly below 1 for a slower delivery

# Themes covered, in segment order.
themes:
  - name: "Models and vendors"
    focus: "LLM releases, token pricing, actual production availability, deprecations"
  - name: "Sovereignty and Europe"
    focus: "European players (Mistral and others), sovereign cloud, funding, partnerships"
  - name: "Platform"
    focus: "AI gateways, model routing, cost control, LLMOps, MLOps (ZenML, MLflow, Vertex AI, Kubernetes), inference"
  - name: "Quality"
    focus: "RAG, model evaluation, LLM-as-a-judge, benchmarks, labelling and annotation"
  - name: "Regulation"
    focus: "EU AI Act, GDPR, upcoming compliance deadlines"
  - name: "Retail and agents"
    focus: "AI at retailers, agentic commerce, in-store and e-commerce use cases"
