# Cloudflare Worker that starts the daily episode on time (see worker.js).
# Deploy: cd scheduler && npx wrangler deploy
# Token:  npx wrangler secret put GITHUB_TOKEN   (fine-grained, this repository, Actions: read and write)
name = "signal-in-the-ai-fog-scheduler"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = false   # no public URL: the worker only runs on its schedule

[vars]
REPOSITORY = "GwendalYviquel/signal-in-the-ai-fog"

[triggers]
# UTC. In summer (Paris = UTC+2): 4:05, 4:35, 5:05, 5:35, 6:05; in winter (UTC+1): 4:05, 4:35, 5:05
# (2:05 and 2:35 UTC fall before 4:00 Paris and are skipped by the worker). The first attempt
# publishes, the next ones stop at once if the episode is out; the GitHub attempts stay as a backup.
crons = ["5,35 2,3 * * 1-5", "5 4 * * 1-5"]
