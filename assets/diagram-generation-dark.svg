<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 306" width="880" height="306" role="img" aria-label="Generation and corrections"><title>Generation and corrections</title><defs><marker id="ae8a33a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8a33a"/></marker></defs><defs><marker id="a8f6cf0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8f6cf0"/></marker></defs><defs><marker id="a5d6480" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5d6480"/></marker></defs><g class="box"><rect x="1.0" y="8.0" width="151.6" height="76.0" rx="12" fill="#161b26" stroke="#2d3446" stroke-width="1.2" class="frame"/><text x="76.8" y="34.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#e6e8f0" text-anchor="middle">Brief</text><text x="76.8" y="50.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a0a6bd" text-anchor="middle">date, themes,</text><text x="76.8" y="65.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a0a6bd" text-anchor="middle">scripts, open items</text></g><g class="box"><rect x="182.6" y="8.0" width="151.6" height="76.0" rx="12" fill="#161b26" stroke="#2d3446" stroke-width="1.2" class="frame"/><text x="258.4" y="34.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#e6e8f0" text-anchor="middle">Claude research</text><text x="258.4" y="50.7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400"