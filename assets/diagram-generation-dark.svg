ans-serif" font-size="11.5" font-weight="400" fill="#a0a6bd" text-anchor="middle">fact-check (Haiku)</text></g><path d="M519.8,46.0 L541.8,46.0" fill="none" stroke="#5d6480" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a5d6480)"/><g class="box"><rect x="727.4" y="8.0" width="151.6" height="76.0" rx="12" fill="#0e3a35" stroke="#3ee6cc" stroke-width="1.2" class="frame"/><text x="803.2" y="42.3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#d6fff8" text-anchor="middle">Accepted</text><text x="803.2" y="58.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#d6fff8" text-anchor="middle">on to the voices</text></g><path d="M701.4,46.0 L723.4,46.0" fill="none" stroke="#5d6480" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a5d6480)"/><path d="M591.6,88 L591.6,126 Q591.6,136 581.6,136 L480.0,136 Q470.0,136 470.0,126 L470.0,90" fill="none" stroke="#8f6cf0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a8f6cf0)"/><g class="box"><rect x="359.0" y="115.0" width="343.6" height="42.0" rx="10" fill="#0f141d" stroke="#8f6cf0" stroke-width="1.2" class="frame"/><text x="530.8" y="132.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#e6e8f0" text-anchor="middle">Wording issue</text><text x="530.8" y="147.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a0a6bd" text-anchor="middle">light correction (Haiku): episode and errors only</text></g><path d="M681.4,88 L681.4,206 Q681.4,216 671.4,216 L268.4,216 Q258.4,216 258.4,206 L258.4,90" fill="none" stroke="#e8a33a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ae8a33a)"/><g class="box"><rect x="314.2" y="195.0" width="311.4" height="42.0" rx="10" fill="#0f141d" stroke="#e8a33a" stroke-width="1.2" class="frame"/><text x="469.9" y="212.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#e6e8f0" text-anchor="middle">Needs new content</text><text x="469.9" y="227.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#a0a6bd" text-anchor="middle">back to research: a source is never invented</text></g><g class="box"><rect x="1.0" y="258.0" width="878.0" height="44.0" rx="12" fill="#3a2a10" stroke="#e8a33a" stroke-width="1.2" class="frame"/><text x="440.0" y="283.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffd79a" text-anchor="middle">At most 3 attempts. If the episode is still invalid, nothing is published.</text></g></svg>
