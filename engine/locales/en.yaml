# English texts of the engine: spoken, feed, chapters, rules. A show picks a locale with
# podcast.language in its show.yaml. Every key here must exist in every locale (a test checks).
# Texts with a {period} variant have one value per cadence: day (daily shows) and week (weekly).

dates:
  weekdays: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
  months: [January, February, March, April, May, June, July, August, September, October, November, December]
  spoken_day: "{weekday}, {month} {day}"       # in the opening
  long_date: "{month} {day}, {year}"           # in the feed
  short_date: "{month} {day}"
  page_date: "{weekday} {day} {month} {year}"            # on the site pages

spoken:
  opening: "Good morning, it's {day}. This is {title}, {tagline}, written and read by AI. Today: {h1}, {h2}, and {h3}."
  story:
    day: "First, the story of the day."
    week: "First, the story of the week."
  segment: "Next, {theme}."
  follow_up: "A follow-up."
  correction: "A correction."
  number:
    day: "The number of the day."
    week: "The number of the week."
  watch: "What to watch."
  question: "And a question for your team."
  sign_off:
    day: "That's it for today. Sources are in the episode description. This was {title}. See you {see_you}."
    week: "That's it for this week. Sources are in the episode description. This was {title}. See you {see_you}."
  see_you:
    next_day: "tomorrow"
    monday: "on Monday"
    next_week: "next week"
  today: "today"                               # the day, when no date is known (length checks)

chapters:
  with: "{name}: {detail}"                      # "Story of the day: <headline>", "<theme>: <topic>"
  opening: "Opening"
  story:
    day: "Story of the day"
    week: "Story of the week"
  follow_up: "Follow-up"
  correction: "Correction"
  number:
    day: "Number of the day"
    week: "Number of the week"
  watch: "What to watch"
  question: "Question for your team"

feed:
  disclaimer: "Script written and voice generated by artificial intelligence."
  catch_up: "Catch-up episode, prepared on {made} with only the news published before {time} on {cutoff} (Paris time)."
  correction: "Correction ({added}): {text}"
  chapters: "Chapters:"
  page: "Transcript, topics and sources: {url}"
  sources: "Sources:"

rules:
  first_person: '\b(we|We|our|Our|ours|us)\b'   # "US" (the country) stays allowed
  correction_example: "The episode of October twentieth said..."
  topic_max_words: 4                             # a topic's canonical name ("EU AI Act")
  unspeakable_symbols: ""                        # symbols the voice reads badly, refused in spoken text

# Interface of the catalog site and the pages. Served to the browser in docs/i18n.json, so that
# the EN | FR switch can translate the interface of any show; episode content stays as written.
