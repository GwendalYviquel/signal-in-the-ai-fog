feed:
  disclaimer: "Script écrit et voix générée par une intelligence artificielle."
  catch_up: "Épisode de rattrapage, préparé le {made} avec uniquement les actualités publiées avant {time} le {cutoff} (heure de Paris)."
  correction: "Rectificatif ({added}) : {text}"
